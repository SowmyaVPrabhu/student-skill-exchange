<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2>Edit Profile</h2>

        <form action="/update-profile" method="post">

            <input type="hidden"
                   name="id"
                   th:value="${user.id}">

            <div class="mb-3">
                <label>Name</label>

                <input type="text"
                       class="form-control"
                       name="name"
                       th:value="${user.name}">
            </div>

            <div class="mb-3">
                <label>College</label>

                <input type="text"
                       class="form-control"
                       name="college"
                       th:value="${user.college}">
            </div>

            <div class="mb-3">
                <label>Bio</label>

                <textarea class="form-control"
                          name="bio"
                          rows="3"
                          th:text="${user.bio}">
                </textarea>
            </div>

            <button class="btn btn-primary">
                Update Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
