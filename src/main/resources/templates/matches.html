<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Skill Matches</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            margin-top:50px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .header{
            color:#1e293b;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="header">
            Skill Matches
        </h2>

        <a href="/dashboard"
           class="btn btn-dark">
            Home
        </a>

    </div>


    <div class="card card-box">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Skill</th>
                    <th>Teacher</th>
                    <th>Learner</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="match : ${matches}">

                    <td>
                        <span class="badge bg-primary fs-6"
                              th:text="${match.skillName}">
                        </span>
                    </td>

                    <td th:text="${match.teacherName}"></td>

                    <td th:text="${match.learnerName}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
