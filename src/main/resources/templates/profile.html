<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            max-width:700px;
            margin-top:60px;
        }

        .profile-card{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .avatar{
            width:120px;
            height:120px;
            background:#1e293b;
            color:white;
            font-size:40px;
            font-weight:bold;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
        }

        .section-title{
            color:#1e293b;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="section-title">
            My Profile
        </h2>

        <a href="/dashboard"
           class="btn btn-dark">
            Home
        </a>

        <a href="/edit-profile"
           class="btn btn-primary">
            Edit Profile
        </a>

    </div>

    <div class="card profile-card">

        <div class="card-body p-5">

            <div class="avatar mb-4"
                 th:text="${#strings.substring(user.name,0,1)}">
            </div>

            <h3 class="text-center mb-4"
                th:text="${user.name}">
            </h3>

            <hr>

            <div class="mb-3">

                <h6 class="text-secondary">
                    Email
                </h6>

                <p class="fs-5"
                   th:text="${user.email}">
                </p>

            </div>


            <div class="mb-3">

                <h6 class="text-secondary">
                    College
                </h6>

                <p class="fs-5"
                   th:text="${user.college}">
                </p>

            </div>


            <div class="mb-3">

                <h6 class="text-secondary">
                    Bio
                </h6>

                <p class="fs-5"
                   th:text="${user.bio}">
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
