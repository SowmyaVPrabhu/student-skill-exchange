<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Skills Dashboard</title>
</head>
<body>

<h1>All Skills</h1>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Skill Name</th>
        <th>Skill Type</th>
    </tr>

    <tr th:each="skill : ${skills}">
        <td th:text="${skill.id}"></td>
        <td th:text="${skill.skillName}"></td>
        <td th:text="${skill.skillType}"></td>
    </tr>

</table>

</body>
</html>
