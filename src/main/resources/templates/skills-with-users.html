<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Skills With Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            margin-top:50px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .header{
            color:#1e293b;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="header">
            Student Skills Dashboard
        </h2>

        <a href="/dashboard"
           class="btn btn-dark">
           Home
        </a>

    </div>


    <div class="card card-box">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Student</th>
                    <th>Skill</th>
                    <th>Type</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="skill : ${skills}">

                    <td>
                        <span th:text="${skill.user != null ? skill.user.name : 'No User'}">
                        </span>
                    </td>

                    <td>

                        <span class="badge bg-primary fs-6"
                              th:text="${skill.skillName}">
                        </span>

                    </td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${skill.skillType == 'TEACH'}"
                              th:text="${skill.skillType}">
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${skill.skillType == 'LEARN'}"
                              th:text="${skill.skillType}">
                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
