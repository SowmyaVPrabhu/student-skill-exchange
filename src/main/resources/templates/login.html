<!DOCTYPE html>
<html>
<head>
    <title>Login | Skill Exchange</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#1e293b,#334155);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:400px;
            padding:40px;
            background:white;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .login-title{
            text-align:center;
            margin-bottom:30px;
            color:#1e293b;
            font-weight:bold;
        }

        .btn-login{
            background:#2563eb;
            color:white;
            width:100%;
            border:none;
            padding:12px;
            border-radius:10px;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .signup-link{
            text-align:center;
            margin-top:20px;
        }

    </style>
</head>

<body>

<div class="login-card">

    <h2 class="login-title">
        PeerLearn
    </h2>

    <form action="/login" method="post">

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="text"
                   class="form-control"
                   name="username"
                   placeholder="Enter email"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   class="form-control"
                   name="password"
                   placeholder="Enter password"
                   required>

        </div>

        <button type="submit"
                class="btn-login">
            Login
        </button>

    </form>

    <div class="signup-link">

        New user?

        <a href="/signup">
            Create account
        </a>

    </div>

</div>

</body>
</html>
