<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Incoming Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            margin-top:50px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold text-dark">
            Incoming Requests
        </h2>

        <a href="/dashboard"
           class="btn btn-dark">
            Home
        </a>

    </div>


    <div class="card card-box">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Sender</th>
                    <th>Skill</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="request : ${requests}">

                    <td th:text="${request.sender.name}"></td>

                    <td th:text="${request.skill.skillName}"></td>

                    <td>

                        <span class="badge bg-warning"
                              th:if="${request.status.toString() == 'PENDING'}"
                              th:text="${request.status}">
                        </span>

                        <span class="badge bg-success"
                              th:if="${request.status.toString() == 'ACCEPTED'}"
                              th:text="${request.status}">
                        </span>

                        <span class="badge bg-danger"
                              th:if="${request.status.toString() == 'REJECTED'}"
                              th:text="${request.status}">
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/accept-request/{id}(id=${request.id})}"
                           class="btn btn-success btn-sm">
                            Accept
                        </a>

                        <a th:href="@{/reject-request/{id}(id=${request.id})}"
                           class="btn btn-danger btn-sm">
                            Reject
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
