<!DOCTYPE html>
<html>
<head>
    <title>Add Skill</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            margin-top:70px;
            max-width:600px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .header{
            color:#1e293b;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="header">
            Add New Skill
        </h2>

        <a href="/dashboard"
           class="btn btn-dark">
            Home
        </a>

    </div>

    <div class="card card-box">

        <div class="card-body p-4">

            <form action="/save-skill" method="post">

                <div class="mb-4">

                    <label class="form-label">
                        Skill Name
                    </label>

                    <input type="text"
                           class="form-control"
                           name="skillName"
                           placeholder="Java, Spring Boot, React..."
                           required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Skill Type
                    </label>

                    <select class="form-select"
                            name="skillType">

                        <option value="TEACH">
                            I Can Teach
                        </option>

                        <option value="LEARN">
                            I Want To Learn
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="btn btn-primary w-100">

                    Add Skill

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
