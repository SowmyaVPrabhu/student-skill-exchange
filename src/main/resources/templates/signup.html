<!DOCTYPE html>
<html>
<head>
    <title>Register | Skill Exchange</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#1e293b,#334155);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .register-card{
            width:500px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;
            color:#1e293b;
            font-weight:bold;
            margin-bottom:30px;
        }

        .btn-register{
            width:100%;
            background:#2563eb;
            color:white;
            padding:12px;
            border:none;
            border-radius:10px;
            transition:0.3s;
        }

        .btn-register:hover{
            background:#1d4ed8;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>
<body>

<div class="register-card">

    <h2 class="title">
        Create Account
    </h2>

    <form action="/register" method="post">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text"
                   class="form-control"
                   name="name"
                   placeholder="Enter your name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   name="password"
                   placeholder="Create password"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">College</label>
            <input type="text"
                   class="form-control"
                   name="college"
                   placeholder="Enter college name">
        </div>

        <div class="mb-4">
            <label class="form-label">Bio</label>
            <textarea class="form-control"
                      rows="3"
                      name="bio"
                      placeholder="Tell us about yourself"></textarea>
        </div>

        <button type="submit"
                class="btn-register">
            Register
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>
</html>
