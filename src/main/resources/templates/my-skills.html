<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Skills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .container-box{
            margin-top:50px;
        }

        .card-box{
            border:none;
            border-radius:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        .header{
            color:#1e293b;
            font-weight:bold;
        }

        .top-buttons a{
            margin-right:10px;
        }

    </style>

</head>
<body>

<div class="container container-box">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="header">
            My Skills
        </h2>

        <div class="top-buttons">

            <a href="/dashboard"
               class="btn btn-dark">
                Home
            </a>

            <a href="/search-skills"
               class="btn btn-secondary">
                Search Skills
            </a>

            <a href="/add-skill"
               class="btn btn-primary">
                Add New Skill
            </a>

        </div>

    </div>


    <div class="card card-box">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                <tr>
                    <th>Skill Name</th>
                    <th>Skill Type</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="skill : ${skills}">

                    <td th:text="${skill.skillName}"></td>

                    <td>

                        <span class="badge bg-success"
                              th:if="${skill.skillType == 'TEACH'}"
                              th:text="${skill.skillType}">
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${skill.skillType == 'LEARN'}"
                              th:text="${skill.skillType}">
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/edit-skill/{id}(id=${skill.id})}"
                           class="btn btn-sm btn-info">
                            Edit
                        </a>

                        <a th:href="@{/delete-skill/{id}(id=${skill.id})}"
                           class="btn btn-sm btn-danger">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
